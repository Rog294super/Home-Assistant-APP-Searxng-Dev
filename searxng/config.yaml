name: "SearXNG"
version: "1.2.1"
slug: "searxng"
description: "Privacy-respecting metasearch engine, reachable at your own LAN hostname instead of through HA ingress"
url: "https://github.com/Rog294super/Home-Assistant-APP-Searxng"
arch:
  - aarch64
  - amd64
init: false
hassio_api: true

# host_network is the key setting that gets you away from the
# "homeassistant.local:8123/api/hassio_ingress/xxxx/" style path.
# The container shares the host's network stack directly, so SearXNG
# is reachable at <host-ip>:<port> with no HA path prefix at all.
host_network: true

# Convenience "open web ui" link shown on the app info page in HA.
# NOTE: this app does not terminate TLS anywhere, so this uses http by
# default. If you put a TLS-terminating reverse proxy in front of it,
# change this back to [PROTO:https].
webui: "[PROTO:http]://[HOST]:[PORT:18080]"

boot: auto
startup: services
services:
  - mqtt:need

# /data and the app's own config directory are the persistent storage
# HA gives every app. We use /data to remember the auto-generated
# secret_key across restarts and updates.
map:
  - type: app_config
    read_only: false

  - type: data
    read_only: false

options:
  base_url: "http://searxng.local/"
  instance_name: "SearXNG"
  port: 18080

  autocomplete: google
  safesearch: 0
  image_proxy: true

  # SearXNG's authenticated Prometheus metrics endpoint. Disable this when
  # entity registration is not needed.
  enable_metrics: true

  # Home Assistant entity registration options
  enable_stats_entities: true

  # MQTT Discovery is configured automatically through the HAOS MQTT service.
  # The service supplies broker host, port, username, and password.
  enable_mqtt_discovery: true
  mqtt_discovery_prefix: "homeassistant"
  mqtt_base_topic: "searxng"

  # Per-category engine blacklists. Each list contains the engines that should
  # be disabled by default for that category, while any engine not listed will
  # continue to use SearXNG's upstream default behavior.
  disabled_engines_general: []
  disabled_engines_images: []
  disabled_engines_videos: []
  disabled_engines_news: []
  disabled_engines_maps: []
  disabled_engines_music: []
  disabled_engines_it: []
  disabled_engines_science: []
  disabled_engines_files: []
  disabled_engines_social: []

  # Legacy configuration retained for backwards compatibility.
  engines:
    google: true
    bing: true
    duckduckgo: true
    startpage: false
    qwant: false
    wikipedia: true
    github: true
    youtube: true
    reddit: false
    stackoverflow: true
    wolframalpha: false


# Visible part with type in HAOS
schema:
  base_url: str
  instance_name: str
  port: int(1024,65535)

  autocomplete: list(360search|baidu|brave|dbpedia|duckduckgo|google|yandex|mwmbl|naver|seznam|sogou|startpage|stract|swisscows|quark|qwant|wikipedia)
  safesearch: int(0,2)
  image_proxy: bool
  enable_metrics: bool

  enable_stats_entities: bool
  
  enable_mqtt_discovery: bool
  mqtt_discovery_prefix: str
  mqtt_base_topic: str

  disabled_engines_general: list(searchmysite|wiby|openlibrary|currency|dictzone|lingva|mozhi|mymemory translated|bing|brave|duckduckgo|google|google cse|mojeek|qwant|startpage|yahoo|seznam|naver|wikipedia|wikibooks|wikiquote|wikisource|wikispecies|wikiversity|wikivoyage|ayo|boardreader|crowdview|ddg definitions|duckduckgo web|encyclosearch|fastbot|fireball|fynd|gabanza|gmx|infospace|mwmbl|privacywall|resulthunter|searchtoday|tineye|tusksearch|vuhuv|wikidata|wolframalpha|yacy|yandex|yep|zapmeta|searchch|bpb|reloado|tagesschau|wikimini|abcnyheter|360search|baidu|quark|sogou)
  disabled_engines_images: list(devicons|flaticon|lucide|material icons|selfhst icons|uxwing|bing images|brave.images|google cse images|google images|mojeek images|qwant images|startpage images|1x|500px|adobe stock|artic|artstation|cara|duckduckgo images|findfiles images|findthatmeme|flickr|frinkiac|giphy|imgur|ipernity|library of congress|magnific|openverse|pexels|picjumbo|pinterest|pixabay images|privacywall images|public domain image archive|resulthunter images|shopify stock|sogou images|stocksnap|tusksearch images|unsplash|vuhuv images|wikicommons.images|yacy images|yandex images|naver images|baidu images|quark images)
  disabled_engines_videos: list(bing videos|brave.videos|google videos|qwant videos|360search videos|adobe stock video|bilibili|bitchute|dailymotion|duckduckgo videos|findfiles videos|fireball videos|google play movies|media.ccc.de|odysee|peertube|pixabay videos|privacywall videos|rumble|sepiasearch|tusksearch videos|vimeo|vuhuv videos|wikicommons.videos|youtube|mediathekviewweb|ina|niconico|naver videos|acfun|iqiyi|sogou videos)
  disabled_engines_news: list(google news|bing news|brave news|duckduckgo news|mojeek news|naver news|qwant news|startpage news|sogou wechat|wikinews|wikimedia|reuters|tagesschau|ansa|il post|fireball news|tusksearch news)
  disabled_engines_maps: list(apple maps|openstreetmap|photon)
  disabled_engines_music: list(genius|radio browser|adobe stock audio|bandcamp|deezer|findfiles music|mixcloud|soundcloud|wikicommons.audio|yandex music|youtube)
  disabled_engines_it: list(alpine linux packages|cachy os packages|crates.io|docker hub|hex|hoogle|lib.rs|metacpan|npm|packagist|pkg.go.dev|pub.dev|pypi|rubygems|voidlinux|askubuntu|caddy.community|discuss.python|pi-hole.community|stackoverflow|superuser|bitbucket|codeberg|gitea.com|github|gitlab|huggingface|huggingface datasets|huggingface spaces|ollama|sourcehut|arch linux wiki|free software directory|gentoo|nixos wiki|anaconda|habrahabr|hackernews|lobste.rs|mankier|mdn|microsoft learn|national vulnerability database|baidu kaifa)
  disabled_engines_science: list(arxiv|crossref|google scholar|openalex|pubmed|semantic scholar|wikispecies|openairedatasets|openairepublications|pdbe)
  disabled_engines_files: list(apk_mirror|apple_app_store|fdroid|google_play_apps)
  disabled_engines_social: list(9gag|boardreader|lemmy comments|lemmy communities|lemmy posts|lemmy users|mastodon hashtags|mastodon users|tootfinder)

  engines:
    google: bool
    bing: bool
    duckduckgo: bool
    startpage: bool
    qwant: bool
    wikipedia: bool
    github: bool
    youtube: bool
    reddit: bool
    stackoverflow: bool
    wolframalpha: bool
