configuration:
  base_url:
    name: Basis-URL
    description: >
      Volledige openbare URL waarop SearXNG bereikbaar is, inclusief het schema.
      Gebruik http:// of https:// en een geldige hostnaam, bijvoorbeeld:
      https://searxng.local/

  instance_name:
    name: Naam van de instantie
    description: Naam die door SearXNG wordt weergegeven.

  port:
    name: Poort
    description: >
      Externe poort waarop SearXNG beschikbaar is.
      Laat een reverse proxy naar deze poort verwijzen.

  autocomplete:
    name: Autocompleteprovider
    description: >
      Provider die wordt gebruikt voor zoeksuggesties.
      Beschikbare autocomplete-backends zijn:
      "360search", "baidu", "brave", "dbpedia", "duckduckgo", "google",
      "yandex", "mwmbl", "naver", "seznam", "sogou", "startpage",
      "stract", "swisscows", "quark", "qwant" en "wikipedia".

  safesearch:
    name: SafeSearch
    description: >
      SafeSearch-niveau (0 = Uit, 1 = Gemiddeld, 2 = Strikt).

  image_proxy:
    name: Afbeeldingsproxy
    description: >
      Laat externe afbeeldingen via SearXNG verlopen.

  enable_metrics:
    name: Metrics-eindpunt inschakelen
    description: Schakel het beveiligde metrics-eindpunt in dat door statistiekentiteiten wordt gebruikt.

  enable_stats_entities:
    name: inschakelen statistieken entiteit.
    description: Schakel dit in voor sensors met statistieken over de searxng app.

  enable_mqtt_discovery:
    name: MQTT Discovery inschakelen
    description: Registreer statistieksensors via MQTT Discovery. Een MQTT-broker is vereist.

  mqtt_discovery_prefix:
    name: MQTT Discovery-prefix
    description: >
      MQTT Discovery-prefix van Home Assistant, normaal homeassistant.
      Meestal niet nodig om aan te passen.

  mqtt_base_topic:
    name: MQTT-state-topicprefix
    description: > 
      Prefix voor SearXNG state-, attributen- en beschikbaarheidstopics. 
      Meestal niet nodig om aan te passen.
      
  disabled_engines_general:
    name: Uitgeschakelde zoekmachines - Algemeen
    description: Exacte SearXNG-engine-namen die standaard uitgeschakeld worden in de algemene categorie.

  disabled_engines_images:
    name: Uitgeschakelde zoekmachines - Afbeeldingen
    description: Exacte SearXNG-engine-namen die standaard uitgeschakeld worden in de afbeeldingscategorie.

  disabled_engines_videos:
    name: Uitgeschakelde zoekmachines - Video's
    description: Exacte SearXNG-engine-namen die standaard uitgeschakeld worden in de videocategorie.

  disabled_engines_news:
    name: Uitgeschakelde zoekmachines - Nieuws
    description: Exacte SearXNG-engine-namen die standaard uitgeschakeld worden in de nieuwscategorie.

  disabled_engines_maps:
    name: Uitgeschakelde zoekmachines - Kaarten
    description: Exacte SearXNG-engine-namen die standaard uitgeschakeld worden in de kaartencategorie.

  disabled_engines_music:
    name: Uitgeschakelde zoekmachines - Muziek
    description: Exacte SearXNG-engine-namen die standaard uitgeschakeld worden in de muziekkategorie.

  disabled_engines_it:
    name: Uitgeschakelde zoekmachines - IT
    description: Exacte SearXNG-engine-namen die standaard uitgeschakeld worden in de IT-categorie.

  disabled_engines_science:
    name: Uitgeschakelde zoekmachines - Wetenschap
    description: Exacte SearXNG-engine-namen die standaard uitgeschakeld worden in de wetenschapscategorie.

  disabled_engines_files:
    name: Uitgeschakelde zoekmachines - Bestanden
    description: Exacte SearXNG-engine-namen die standaard uitgeschakeld worden in de bestanden-categorie.

  disabled_engines_social:
    name: Uitgeschakelde zoekmachines - Sociaal
    description: Exacte SearXNG-engine-namen die standaard uitgeschakeld worden in de sociale categorie.

  disabled_engines:
    name: Uitgeschakelde zoekmachines (legacy)
    description: Verouderde compatibiliteitslijst; gebruik bij voorkeur de per-categorievelden hierboven.

  engines:
    name: Zoekmachines
    description: >
      Engines die hier niet staan maar wel worden gebruikt door searxng settings.yml, 
      gebruiken default van searxng image.

  engines.google:
    name: Google

  engines.bing:
    name: Bing

  engines.duckduckgo:
    name: DuckDuckGo

  engines.startpage:
    name: Startpage

  engines.qwant:
    name: Qwant

  engines.wikipedia:
    name: Wikipedia

  engines.github:
    name: GitHub

  engines.youtube:
    name: YouTube

  engines.reddit:
    name: Reddit

  engines.stackoverflow:
    name: Stack Overflow

  engines.wolframalpha:
    name: WolframAlpha