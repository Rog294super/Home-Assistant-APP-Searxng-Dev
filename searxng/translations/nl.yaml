configuration:
  base_url:
    name: Basis-URL
    description: >
      Volledige openbare URL waarop SearXNG bereikbaar is, inclusief het schema.
      Gebruik http:// of https:// en een geldige hostnaam, bijvoorbeeld:
      https://searxng.local/

  instance_name:
    name: Naam van de instantie
    description: Naam die door SearXNG wordt weergegeven.

  port:
    name: Poort
    description: >
      Externe poort waarop SearXNG beschikbaar is.
      Laat een reverse proxy naar deze poort verwijzen.

  autocomplete:
    name: Autocompleteprovider
    description: >
      Provider die wordt gebruikt voor zoeksuggesties.
      Beschikbare autocomplete-backends zijn:
      "360search", "baidu", "brave", "dbpedia", "duckduckgo", "google",
      "yandex", "mwmbl", "naver", "seznam", "sogou", "startpage",
      "stract", "swisscows", "quark", "qwant" en "wikipedia".

  safesearch:
    name: SafeSearch
    description: >
      SafeSearch-niveau (0 = Uit, 1 = Gemiddeld, 2 = Strikt).

  image_proxy:
    name: Afbeeldingsproxy
    description: >
      Laat externe afbeeldingen via SearXNG verlopen.

  enable_metrics:
    name: Metrics-eindpunt inschakelen
    description: Schakel het beveiligde metrics-eindpunt in dat door statistiekentiteiten wordt gebruikt.

  enable_stats_entities:
    name: inschakelen statistieken entiteit.
    description: Schakel dit in voor sensors met statistieken over de searxng app.

  enable_mqtt_discovery:
    name: MQTT Discovery inschakelen
    description: Registreer statistieksensors via MQTT Discovery. Een MQTT-broker is vereist.

  mqtt_discovery_prefix:
    name: MQTT Discovery-prefix
    description: >
      MQTT Discovery-prefix van Home Assistant, normaal homeassistant.
      Meestal niet nodig om aan te passen.

  mqtt_base_topic:
    name: MQTT-state-topicprefix
    description: > 
      Prefix voor SearXNG state-, attributen- en beschikbaarheidstopics. 
      Meestal niet nodig om aan te passen.
      
  engine_groups:
    name: Zoekmachinecategorieën
    description: >
      Schakel brede typen zoekbronnen in of uit. Deze schakelaars zijn een
      gebruiksvriendelijk alternatief voor handmatig typen van engine-namen.

  engine_groups.general:
    name: Algemeen

  engine_groups.images:
    name: Afbeeldingen

  engine_groups.videos:
    name: Video's

  engine_groups.news:
    name: Nieuws

  engine_groups.maps:
    name: Kaarten

  engine_groups.music:
    name: Muziek

  engine_groups.it:
    name: IT

  engine_groups.science:
    name: Wetenschap

  engine_groups.files:
    name: Bestanden

  disabled_engines:
    name: Uitgeschakelde Zoekmachines
    description: >
      De hier vermelde zoekmachines zijn standaard uitgeschakeld voor gebruikers. 
      Gebruikers kunnen ze inschakelen via de voorkeuren knop in de browser.
      Wanneer deze lijst niet leeg is, wordt hij exclusief gebruikt en worden de losse schakelaars bij 'Search engines' hieronder volledig genegeerd. 
      Laat deze lijst leeg als je liever de schakelaars gebruikt.
      De `zoekmachine`-opties worden op zijn vroegst in versie 1.3.0 afgeschaft.

  engines:
    name: Zoekmachines
    description: >
      Engines die hier niet staan maar wel worden gebruikt door searxng settings.yml, 
      gebruiken default van searxng image.

  engines.google:
    name: Google

  engines.bing:
    name: Bing

  engines.duckduckgo:
    name: DuckDuckGo

  engines.startpage:
    name: Startpage

  engines.qwant:
    name: Qwant

  engines.wikipedia:
    name: Wikipedia

  engines.github:
    name: GitHub

  engines.youtube:
    name: YouTube

  engines.reddit:
    name: Reddit

  engines.stackoverflow:
    name: Stack Overflow

  engines.wolframalpha:
    name: WolframAlpha