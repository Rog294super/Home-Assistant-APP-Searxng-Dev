configuration:
  base_url:
    name: Base URL
    description: >
      The public URL where your SearXNG instance can be reached.
      Example: https://searxng.local

  instance_name:
    name: Instance name
    description: Name displayed by SearXNG.
  
  port: 
    name: Port
    description: >
      External port SearXNG, 
      Point reverse proxy to this port.
  
  autocomplete:
    name: Autocomplete provider
    description: > 
      Provider used for search suggestions.
      Existing autocomplete backends: 
      "360search", "baidu", "brave", "dbpedia", "duckduckgo", "google", 
      "yandex","mwmbl", "naver", "seznam", "sogou", "startpage", 
      "stract", "swisscows", "quark", "qwant", "wikipedia"
  
  safesearch:
    name: SafeSearch
    description: SafeSearch level (0 = Off, 1 = Moderate, 2 = Strict).

  image_proxy:
    name: Image proxy
    description: Proxy remote images through SearXNG.

  enable_metrics:
    name: Enable metrics endpoint
    description: Enable the authenticated metrics endpoint used by statistics entities.

  enable_stats_entities:
    name: Enable entity stats.
    description: Enable this for sensors with stats about the searxng app.

  enable_mqtt_discovery:
    name: Enable MQTT Discovery
    description: Register statistics sensors through MQTT Discovery. An MQTT broker is required.

  mqtt_host:
    name: MQTT broker host
    description: Hostname or IP address of the MQTT broker.

  mqtt_port:
    name: MQTT broker port
    description: Port of the MQTT broker.

  mqtt_username:
    name: MQTT username
    description: Optional MQTT username.

  mqtt_password:
    name: MQTT password
    description: Optional MQTT password.

  mqtt_discovery_prefix:
    name: MQTT Discovery prefix
    description: Home Assistant MQTT Discovery prefix, normally homeassistant.

  mqtt_base_topic:
    name: MQTT state topic prefix
    description: Prefix for SearXNG state, attributes, and availability topics.

  disabled_engines:
    name: Disabled Engines
    description: >
      search engines here noted shall be disabled at default for users. 
      Users can enable through prefferences in the browser.
      search engines noted here should not be enabled by Search Engines which is below this option.
      Search engines options shall be deprecated at earliest on version 1.4.0

  engines:
    name: Search engines
    description: >
      Engines which are not noted here but are used in the searxng setting.yml, 
      are using default set by Searxng image

  engines.google:
    name: Google

  engines.bing:
    name: Bing

  engines.duckduckgo:
    name: DuckDuckGo

  engines.startpage:
    name: Startpage

  engines.qwant:
    name: Qwant

  engines.wikipedia:
    name: Wikipedia
  
  engines.github:
    name: GitHub

  engines.youtube:
    name: YouTube

  engines.reddit:
    name: Reddit

  engines.stackoverflow:
    name: Stack Overflow

  engines.wolframalpha:
    name: WolframAlpha