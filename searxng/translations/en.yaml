configuration:
  base_url:
    name: Base URL
    description: >
      Full public URL where SearXNG is reachable, including the scheme.
      Use http:// or https:// and a valid hostname, for example:
      https://searxng.local/

  instance_name:
    name: Instance name
    description: Name displayed by SearXNG.
  
  port: 
    name: Port
    description: >
      External port SearXNG, 
      Point reverse proxy to this port.
  
  autocomplete:
    name: Autocomplete provider
    description: > 
      Provider used for search suggestions.
      Existing autocomplete backends: 
      "360search", "baidu", "brave", "dbpedia", "duckduckgo", "google", 
      "yandex","mwmbl", "naver", "seznam", "sogou", "startpage", 
      "stract", "swisscows", "quark", "qwant", "wikipedia"
  
  safesearch:
    name: SafeSearch
    description: SafeSearch level (0 = Off, 1 = Moderate, 2 = Strict).

  image_proxy:
    name: Image proxy
    description: Proxy remote images through SearXNG.

  enable_metrics:
    name: Enable metrics endpoint
    description: Enable the authenticated metrics endpoint used by statistics entities.

  enable_stats_entities:
    name: Enable entity stats.
    description: Enable this for sensors with stats about the searxng app.

  enable_mqtt_discovery:
    name: Enable MQTT Discovery
    description: Register statistics sensors through MQTT Discovery. An MQTT broker is required.

  mqtt_discovery_prefix:
    name: MQTT Discovery prefix
    description: >
      Home Assistant MQTT Discovery prefix, normally homeassistant.
      Most of the time no need to be changed.

  mqtt_base_topic:
    name: MQTT state topic prefix
    description: >
      Prefix for SearXNG state, attributes, and availability topics.
      Most of the time no need to be changed.

  engine_groups:
    name: Engine categories
    description: >
      Enable or disable broad types of search sources. These toggles work
      as a user-friendly alternative to typing engine names manually.

  engine_groups.general:
    name: General

  engine_groups.images:
    name: Images

  engine_groups.videos:
    name: Videos

  engine_groups.news:
    name: News

  engine_groups.maps:
    name: Maps

  engine_groups.music:
    name: Music

  engine_groups.it:
    name: IT

  engine_groups.science:
    name: Science

  engine_groups.files:
    name: Files

  engine_groups.social:
    name: Social media

  disabled_engines:
    name: Disabled Engines
    description: >
      search engines here noted shall be disabled at default for users. 
      Users can enable through preferences in the browser.
      If this list is not empty, it is used exclusively, and the individual toggles under 'Search engines' below are completely ignored. 
      Leave this list empty if you prefer to use the toggles.
      `Search engines` options shall be deprecated at earliest on version 1.3.0.

  engines:
    name: Search engines
    description: >
      Engines which are not noted here but are used in the searxng setting.yml, 
      are using default set by Searxng image

  engines.google:
    name: Google

  engines.bing:
    name: Bing

  engines.duckduckgo:
    name: DuckDuckGo

  engines.startpage:
    name: Startpage

  engines.qwant:
    name: Qwant

  engines.wikipedia:
    name: Wikipedia
  
  engines.github:
    name: GitHub

  engines.youtube:
    name: YouTube

  engines.reddit:
    name: Reddit

  engines.stackoverflow:
    name: Stack Overflow

  engines.wolframalpha:
    name: WolframAlpha