configuration:
  base_url:
    name: Base URL
    description: >
      Full public URL where SearXNG is reachable, including the scheme.
      Use http:// or https:// and a valid hostname, for example:
      https://searxng.local/

  instance_name:
    name: Instance name
    description: Name displayed by SearXNG.
  
  port: 
    name: Port
    description: >
      External port SearXNG, 
      Point reverse proxy to this port.
  
  autocomplete:
    name: Autocomplete provider
    description: > 
      Provider used for search suggestions.
      Existing autocomplete backends: 
      "360search", "baidu", "brave", "dbpedia", "duckduckgo", "google", 
      "yandex","mwmbl", "naver", "seznam", "sogou", "startpage", 
      "stract", "swisscows", "quark", "qwant", "wikipedia"
  
  safesearch:
    name: SafeSearch
    description: SafeSearch level (0 = Off, 1 = Moderate, 2 = Strict).

  image_proxy:
    name: Image proxy
    description: Proxy remote images through SearXNG.

  enable_metrics:
    name: Enable metrics endpoint
    description: Enable the authenticated metrics endpoint used by statistics entities.

  enable_stats_entities:
    name: Enable entity stats.
    description: Enable this for sensors with stats about the searxng app.

  enable_mqtt_discovery:
    name: Enable MQTT Discovery
    description: Register statistics sensors through MQTT Discovery. An MQTT broker is required.

  mqtt_discovery_prefix:
    name: MQTT Discovery prefix
    description: >
      Home Assistant MQTT Discovery prefix, normally homeassistant.
      Most of the time no need to be changed.

  mqtt_base_topic:
    name: MQTT state topic prefix
    description: >
      Prefix for SearXNG state, attributes, and availability topics.
      Most of the time no need to be changed.

  disabled_engines_general:
    name: Disabled engines - General
    description: >
      Comma-separated SearXNG engine names to disable by default in the general
      category, for example: google, bing, wikipedia.

  disabled_engines_images:
    name: Disabled engines - Images
    description: >
      Comma-separated SearXNG engine names to disable by default in the image
      category, for example: google images, bing images.

  disabled_engines_videos:
    name: Disabled engines - Videos
    description: >
      Comma-separated SearXNG engine names to disable by default in the video
      category, for example: youtube, vimeo.

  disabled_engines_news:
    name: Disabled engines - News
    description: >
      Comma-separated SearXNG engine names to disable by default in the news
      category.

  disabled_engines_maps:
    name: Disabled engines - Maps
    description: >
      Comma-separated SearXNG engine names to disable by default in the maps
      category.

  disabled_engines_music:
    name: Disabled engines - Music
    description: >
      Comma-separated SearXNG engine names to disable by default in the music
      category.

  disabled_engines_it:
    name: Disabled engines - IT
    description: >
      Comma-separated SearXNG engine names to disable by default in the IT
      category.

  disabled_engines_science:
    name: Disabled engines - Science
    description: >
      Comma-separated SearXNG engine names to disable by default in the science
      category.

  disabled_engines_files:
    name: Disabled engines - Files
    description: >
      Comma-separated SearXNG engine names to disable by default in the files
      category.

  disabled_engines_social:
    name: Disabled engines - Social
    description: >
      Comma-separated SearXNG engine names to disable by default in the social
      category.

  disabled_engines:
    name: Disabled Engines (legacy)
    description: Deprecated comma-separated compatibility field. Use the per-category fields above when possible.

  engines:
    name: Search engines
    description: >
      Engines which are not noted here but are used in the searxng setting.yml, 
      are using default set by Searxng image

  engines.google:
    name: Google

  engines.bing:
    name: Bing

  engines.duckduckgo:
    name: DuckDuckGo

  engines.startpage:
    name: Startpage

  engines.qwant:
    name: Qwant

  engines.wikipedia:
    name: Wikipedia
  
  engines.github:
    name: GitHub

  engines.youtube:
    name: YouTube

  engines.reddit:
    name: Reddit

  engines.stackoverflow:
    name: Stack Overflow

  engines.wolframalpha:
    name: WolframAlpha