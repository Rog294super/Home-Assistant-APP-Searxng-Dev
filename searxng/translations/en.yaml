      wikibooks, wikiquote, wikisource, wikispecies, wikiversity, wikivoyage,
      ayo, boardreader, crowdview, ddg definitions, duckduckgo web,
      encyclosearch, fastbot, fireball, fynd, gabanza, gmx, infospace, mwmbl,
      privacywall, resulthunter, searchtoday, tineye, tusksearch, vuhuv,
