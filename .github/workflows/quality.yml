name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Home Assistant app metadata
        id: app-info
        uses: home-assistant/actions/helpers/info@86d4564712fa02543c808e3a693dd04f9d3f8361 # 2026-10-26
        with:
          path: searxng

      - name: Normalize app version
        id: app-version
        shell: bash
        env:
          VERSION_JSON: ${{ steps.app-info.outputs.version }}
        run: |
          version=$(jq -r . <<< "$VERSION_JSON")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check PR bump requirement for existing image tag
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          IMAGE_REF: ghcr.io/rog294super/searxng:${{ steps.app-version.outputs.version }}
        run: |
          if ! docker buildx imagetools inspect "${IMAGE_REF}" >/tmp/searxng-tag-check.txt 2>&1; then
            if grep -Eq 'not found|manifest unknown|MANIFEST_UNKNOWN' /tmp/searxng-tag-check.txt; then
              echo "Image tag ${IMAGE_REF} does not exist yet; PR check passes silently."
              exit 0
            fi
            echo "Could not inspect ${IMAGE_REF}; assuming package is not yet published."
            exit 0
          fi

          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- searxng/Dockerfile searxng/requirements.txt searxng/run.sh searxng/monitor.py searxng/generate_settings.py searxng/validate_base_url.py searxng/valkey-server.sh | grep -q .; then
            echo "::error::Image files changed but version was not bumped. Never push a different image under an existing tag."
            exit 1
          fi

          echo "Existing image tag found and no image-affecting changes detected; PR check passes."

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: searxng

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: searxng/Dockerfile

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install pinned test dependencies
        run: >-
          python -m pip install --require-hashes
          -r searxng/requirements.txt

      - name: Validate YAML and tests
        shell: bash
        run: |
          python - <<'PY'
          import yaml
          for path in [
              'searxng/config.yaml',
              'searxng/translations/en.yaml',
              'searxng/translations/nl.yaml',
          ]:
              with open(path, 'r', encoding='utf-8') as handle:
                  yaml.safe_load(handle)
          print('YAML validation passed')
          PY

          if find searxng -maxdepth 2 -name 'test*.py' | grep -q .; then
            python -m unittest discover -s searxng -p 'test*.py' -v
          else
            echo 'No Python tests found under searxng; skipping unittest discovery.'
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Home Assistant app image for amd64
        env:
          APP_VERSION: ${{ steps.app-version.outputs.version }}
        run: >-
          docker buildx build
          --platform linux/amd64
          --build-arg BUILD_ARCH=amd64
          --build-arg BUILD_VERSION="$APP_VERSION"
          --tag local/searxng:ci-amd64
          --load
          searxng

      - name: Smoke test Valkey on amd64 image
        run: >-
          docker run --rm --platform linux/amd64 --entrypoint /valkey-server.sh
          local/searxng:ci-amd64 --version
          | tee /tmp/valkey-amd64.txt

      - name: Assert Valkey version output on amd64
        shell: bash
        run: |
          grep -Eq 'Valkey|v=' /tmp/valkey-amd64.txt

      - name: Smoke test Python dependencies on amd64 image
        run: >-
          docker run --rm --platform linux/amd64
          --entrypoint /usr/local/searxng/.venv/bin/python
          local/searxng:ci-amd64 -c "import valkey, yaml, paho.mqtt.client"

      - name: Build Home Assistant app image for aarch64
        env:
          APP_VERSION: ${{ steps.app-version.outputs.version }}
        run: >-
          docker buildx build
          --platform linux/arm64
          --build-arg BUILD_ARCH=aarch64
          --build-arg BUILD_VERSION="$APP_VERSION"
          --tag local/searxng:ci-aarch64
          --load
          searxng

      - name: Smoke test Valkey on aarch64 image
        run: >-
          docker run --rm --platform linux/arm64 --entrypoint /valkey-server.sh
          local/searxng:ci-aarch64 --version
          | tee /tmp/valkey-arm64.txt

      - name: Assert Valkey version output on aarch64
        shell: bash
        run: |
          grep -Eq 'Valkey|v=' /tmp/valkey-arm64.txt

      - name: Smoke test Python dependencies on aarch64 image
        run: >-
          docker run --rm --platform linux/arm64
          --entrypoint /usr/local/searxng/.venv/bin/python
          local/searxng:ci-aarch64 -c "import valkey, yaml, paho.mqtt.client"