name: Quality checks

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: searxng
          additional_files: run.sh

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: searxng/Dockerfile

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.x'

      - name: Install YAML test dependency
        run: python -m pip install PyYAML

      - name: Validate YAML and tests
        shell: bash
        run: |
          python -c "import yaml; [yaml.safe_load(open(path)) for path in ['searxng/config.yaml', 'searxng/translations/en.yaml', 'searxng/translations/nl.yaml']]"
          python -m unittest discover -s searxng -v