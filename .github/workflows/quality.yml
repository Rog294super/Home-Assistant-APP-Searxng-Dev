name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: searxng

      - name: Run Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: searxng/Dockerfile

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Install YAML test dependency
        run: python -m pip install PyYAML

      - name: Validate YAML and tests
        shell: bash
        run: |
          python - <<'PY'
          import yaml
          for path in [
              'searxng/config.yaml',
              'searxng/translations/en.yaml',
              'searxng/translations/nl.yaml',
          ]:
              with open(path, 'r', encoding='utf-8') as handle:
                  yaml.safe_load(handle)
          print('YAML validation passed')
          PY

          if find searxng -maxdepth 2 -name 'test*.py' | grep -q .; then
            python -m unittest discover -s searxng -p 'test*.py' -v
          else
            echo 'No Python tests found under searxng; skipping unittest discovery.'
          fi