name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Home Assistant app metadata
        id: app-info
        uses: home-assistant/actions/helpers/info@58bff37c8947f690ace498be413a9b78d6f30f93 # 2026-09-10
        with:
          path: searxng

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: searxng

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: searxng/Dockerfile

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install YAML test dependency
        run: python -m pip install PyYAML

      - name: Validate YAML and tests
        shell: bash
        run: |
          python - <<'PY'
          import yaml
          for path in [
              'searxng/config.yaml',
              'searxng/translations/en.yaml',
              'searxng/translations/nl.yaml',
          ]:
              with open(path, 'r', encoding='utf-8') as handle:
                  yaml.safe_load(handle)
          print('YAML validation passed')
          PY

          if find searxng -maxdepth 2 -name 'test*.py' | grep -q .; then
            python -m unittest discover -s searxng -p 'test*.py' -v
          else
            echo 'No Python tests found under searxng; skipping unittest discovery.'
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Home Assistant app image
        env:
          APP_VERSION: ${{ steps.app-info.outputs.version }}
        run: >-
          docker buildx build
          --platform linux/amd64
          --build-arg BUILD_ARCH=amd64
          --build-arg BUILD_VERSION="$APP_VERSION"
          --tag local/searxng:ci
          --load
          searxng